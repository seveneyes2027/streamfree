name: YouTube Test Loop Stream

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: කේතය ලබා ගැනීම (Checkout Repository)
      uses: actions/checkout@v4

    - name: Python සකස් කිරීම
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: FFmpeg ස්ථාපනය කිරීම (Install FFmpeg)
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: ffmpeg
        version: 1.0

    - name: Stream Script එක ක්‍රියාත්මක කිරීම
      run: |
        python stream.py
